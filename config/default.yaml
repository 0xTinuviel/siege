bank_pop_size: 20
attacker_pop_size: 40

# Bootstrapping: evolve attackers against frozen weak banks before coevolution
bootstrap_generations: 10
bootstrap_target_success_rate: 0.30

max_generations: 100
elite_count: 3
crossover_rate: 0.1
tournament_size: 3
legitimate_tx_count: 30
random_perturbation_count: 10
max_turns_per_episode: 5
hof_max_size: 100
hof_eval_sample_size: 50
speciation_threshold: 0.3
min_species_size: 2
fitness_sharing_sigma: 0.3
archetype_protection_generations: 15
min_per_archetype: 2
mc_bank_min_legit_rate: 0.5
mc_relaxation_threshold: 0.2
stagnation_window: 10
random_immigrant_count_banks: 3
random_immigrant_count_attackers: 5
# Set llm_api_base and llm_api_key_env for your provider.
# Defaults: no base URL (uses OpenAI), key from LLM_API_KEY env var.
# llm_api_base: "https://inference-api.nousresearch.com/v1"
# llm_api_key_env: "LLM_API_KEY"

# Asymmetric models: attackers get stronger model (creative reasoning is harder),
# banks get weaker model (instruction-following is easier)
llm_model_bank: "claude-haiku-4-5-20251001"
llm_model_attacker: "claude-sonnet-4-20250514"
llm_model_mutation: "claude-sonnet-4-20250514"
llm_model_judge: "claude-haiku-4-5-20251001"
max_tokens_per_call: 1024
max_concurrent_llm_calls: 20
output_dir: "./evolution_output"
save_every_n_generations: 5
save_full_genomes: true
