[project]
name = "siege"
version = "0.1.0"
description = "Self-Improving Evolutionary Guard Experiment — adversarial coevolution of bank defense and prompt injection agents"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
